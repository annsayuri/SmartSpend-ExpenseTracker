name: smartspend_expensetracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Authentication & Security Packages: 🔒
  bcrypt: ^1.1.3
  crypto: ^3.0.3

  # Profile Picture Selection 📸
  image_picker: ^1.1.2

  # PDF සහ CSV සඳහා Packages:
  pdf: ^3.11.1
  printing: ^5.13.3
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.19.0
  
  # Chrome (Web) එකේ SQLite වැඩ කිරීමට:
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: ^0.4.5+4
  
  # 📊 Chart Package (Bar Graph සඳහා)
  fl_chart: ^1.2.0
  
  shared_preferences: ^2.3.5
  provider: ^6.1.2

# දෝෂ සහිත jni 1.0.1 package එක ඉවත් කර 1.0.3 ලබා දීමට:
dependency_overrides:
  jni: 1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true